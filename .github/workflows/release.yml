name: Release Binaries
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/
